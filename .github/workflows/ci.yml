name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-unit:
    # The runner is still a Node 14 codebase; its toolchain (nyc, eslint 5)
    # runs on the same Node version the image ships with.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 14
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run unit-tests
